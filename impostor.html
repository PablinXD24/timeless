<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Syne:wght@700;800&family=VT323&display=swap" rel="stylesheet">

<style>
    :root {
        --font-display: 'Syne', sans-serif;
        --font-data: 'Special Elite', cursive, monospace;
        --font-mono: 'VT323', monospace;
        --card-radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        background-color: #000000;
        color: #000000;
        height: 100vh; 
        height: 100dvh;
        width: 100vw;
        font-family: var(--font-data);
        display: flex; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.4s ease;
    }

    /* --- EFEITO PORTAL FECHANDO (CINEMÁTICO ARANHAVERSO) --- */
    body.portal-closing {
        transform: scaleY(0.005) scaleX(1.2);
        opacity: 0;
        background-color: #000000 !important;
        filter: brightness(3) contrast(2);
    }

    .noise, .ambilight-bg { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        z-index: 0; opacity: 0.15; 
        background: repeating-linear-gradient(45deg, #222, #222 1px, transparent 1px, transparent 10px); 
        pointer-events: none; 
    }

    .container {
        position: relative;
        width: 100%;
        max-width: 520px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 15px;
        margin: 0 auto;
        height: 100%;
    }

    /* --- ESTÉTICA DE CARTA SKETCH COM FLIP (TELA INTEIRA) --- */
    .flip-card-container {
        perspective: 1000px;
        width: 100%;
        max-width: 440px;
        height: 85vh;
        max-height: 650px;
        margin: 0 auto;
        cursor: pointer;
    }

    .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-style: preserve-3d;
    }

    .flip-card-container.flipped .flip-card-inner {
        transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: var(--card-radius);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px 30px;
        border: 4px solid #000000;
        box-shadow: 8px 8px 0px #000000;
        overflow: hidden;
    }

    .flip-card-front {
        background: #ff2a75;
        color: #fff;
    }

    .flip-card-back {
        background: #ffd600;
        color: #000000;
        transform: rotateY(180deg);
        overflow-y: auto;
    }

    .card-brand { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; align-self: flex-end; margin-top: auto; color: inherit; text-transform: uppercase; }
    
    /* Texto integrado diretamente na carta com estilo máquina de escrever / carimbo */
    .secret-word-content {
        font-family: var(--font-data);
        font-size: clamp(1.5rem, 6vw, 2.3rem);
        font-weight: 400;
        color: #000000;
        margin: auto 0;
        word-break: break-word;
        overflow-wrap: break-word;
        text-transform: uppercase;
        letter-spacing: 2px;
        line-height: 1.4;
        text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
    }

    .secret-word-content.impostor-alert {
        color: #ffffff;
        font-size: clamp(1.3rem, 5vw, 2rem);
        text-shadow: 2px 2px 0px #000000;
        line-height: 1.5;
    }

    /* --- LISTAS E JOGADORES --- */
    .players-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 280px;
        overflow-y: auto;
        padding-right: 4px;
        margin-bottom: 15px;
        width: 100%;
    }
    .players-list::-webkit-scrollbar { width: 5px; }
    .players-list::-webkit-scrollbar-thumb { background: #000000; }

    .player-row {
        background: #f0f0f0;
        border: 3px solid #000000;
        padding: 12px 15px;
        border-radius: 0px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        font-size: clamp(0.9rem, 3.5vw, 1rem);
        color: #000000;
        box-shadow: 3px 3px 0px #000000;
        text-transform: uppercase;
        font-family: var(--font-data);
        word-break: break-word;
        text-align: left;
    }

    /* --- PAINÉIS / CARDS ESTILO HUB --- */
    .glass-card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 4px solid #000000;
        border-radius: 0px;
        padding: 20px;
        box-shadow: 6px 6px 0px #000000;
        text-align: center;
        color: #000000;
    }

    .card-title {
        font-family: var(--font-display);
        font-size: clamp(1.2rem, 5vw, 1.5rem);
        font-weight: 800;
        color: #000000;
        margin-bottom: 14px;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        word-break: break-word;
    }

    .desc-text {
        font-family: var(--font-data);
        font-size: clamp(0.9rem, 3.5vw, 1rem);
        color: #000;
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 15px;
        text-transform: uppercase;
        text-align: center;
        width: 100%;
        word-break: break-word;
    }

    /* --- BOTÕES LÍQUIDOS ESTILO HUB --- */
    .btn {
        background: #ffd600; 
        color: #000000; 
        border: 4px solid #000000; 
        padding: 15px; 
        border-radius: 0px; 
        font-weight: 800; 
        font-size: clamp(1rem, 4vw, 1.15rem); 
        font-family: var(--font-display); 
        width: 100%; 
        cursor: pointer; 
        box-shadow: 5px 5px 0px #000000; 
        transition: 0.2s ease; 
        text-transform: uppercase; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 8px;
        text-align: center;
        word-break: break-word;
    }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0px #000000; background: #adff2f; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000000; }
    
    .btn-blue { 
        background: #00bfff;
        color: #000000;
    }
    .btn-blue:hover { background: #adff2f; }

    .btn-green { 
        background: #00ff66; 
        color: #000000;
    }
    .btn-green:hover { background: #adff2f; }

    /* Votação */
    .vote-btn {
        background: #ffffff;
        color: #000000; 
        border: 3px solid #000000;
        padding: 14px 16px; 
        border-radius: 0px; 
        font-weight: 700; 
        font-size: clamp(0.9rem, 3.5vw, 1rem);
        width: 100%; 
        cursor: pointer; 
        transition: 0.2s; 
        text-transform: uppercase;
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        box-shadow: 3px 3px 0px #000000;
        font-family: var(--font-data);
        text-align: left;
        word-break: break-word;
    }
    .vote-btn:hover {
        background: #ff2a75;
        color: #fff;
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px #000000;
    }
    .vote-btn.voted {
        background: #00ff66;
        color: #000;
        border-color: #000;
    }

    /* --- MODAL DE FASE / OVERLAY DE RESULTADO --- */
    .overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        width: 100dvw; height: 100dvh;
        background: rgba(0, 0, 0, 0.92); z-index: 1000;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        padding: 20px; text-align: center;
        overflow-y: auto;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .overlay-title {
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 7vw, 3rem); 
        font-weight: 800; 
        color: #ffd600;
        text-transform: uppercase; 
        letter-spacing: -1px; 
        margin-bottom: 12px;
        word-break: break-word;
    }

    .overlay-desc {
        font-family: var(--font-data); 
        font-size: clamp(1rem, 4vw, 1.15rem); 
        color: #fff;
        background: #1e1e24;
        border: 4px solid #000;
        padding: 20px;
        width: 100%;
        max-width: 440px; 
        margin-bottom: 20px; 
        line-height: 1.5;
        text-transform: uppercase;
        box-shadow: 5px 5px 0px #ff2a75;
        word-break: break-word;
    }

    .confetti {
        position: absolute; width: 10px; height: 10px; opacity: 0.9;
        border: 2px solid #000;
        animation: fall linear infinite;
    }
    @keyframes fall {
        0% { transform: translateY(-5vh) translateX(0) scale(0.8); top: 0; }
        50% { transform: translateY(50vh) translateX(25px) scale(1.1); top: 0; }
        100% { transform: translateY(105vh) translateX(-25px) scale(0.8); top: 0; }
    }
</style>


<!-- PAINEL 2: FASE DE REVELAÇÃO DA PALAVRA / DISCUSSÃO -->
<div id="game-panel" style="display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center;">
    
    <!-- CARTA COM FLIP (ESTÉTICA SKETCH) -->
    <div class="flip-card-container" id="flip-card" onclick="toggleCardFlip()">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <div style="font-size: 1rem; letter-spacing: 1px; font-weight: 700; font-family: var(--font-mono);">TOQUE PARA VIRAR</div>
                <div style="font-size: 5rem; margin: auto;"><i class="fa-solid fa-mask"></i></div>
                <div class="card-brand">IMPOSTOR</div>
            </div>
            <div class="flip-card-back">
                <div style="font-size: 0.9rem; font-weight: 700; color: #000; text-transform: uppercase; font-family: var(--font-mono);" id="back-subtitle">Sua Palavra</div>
                <!-- Texto integrado diretamente na carta usando a fonte Special Elite (estilo máquina de escrever impressa) -->
                <div class="secret-word-content" id="secret-word-display">...</div>
                <div class="card-brand">IMPOSTOR</div>
            </div>
        </div>
    </div>

    <div id="host-voting-action" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 100;">
        <button class="btn btn-green" onclick="goToVotingPhase()">
            <i class="fa-solid fa-gavel"></i> ABRIR VOTAÇÃO
        </button>
    </div>
</div>

<!-- PAINEL 3: FASE DE VOTAÇÃO -->
<div class="glass-card" id="voting-panel" style="display: none;">
    <div class="card-title"><i class="fa-solid fa-vote-yea"></i> Hora de Votar no Impostor!</div>
    <div class="desc-text" style="margin-bottom: 12px;">Quem você acha que é o impostor que não sabia a palavra?</div>
    <div class="players-list" id="voting-players-list">
        <!-- Gerado via JS -->
    </div>
</div>
